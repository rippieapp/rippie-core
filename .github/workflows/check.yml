name: Quality Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Biome
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Run TypeScript check
        run: bun run typecheck

      - name: Build
        run: bun run build

  node:
    name: Node compatibility
    runs-on: ubuntu-latest
    needs: check

    strategy:
      fail-fast: false
      matrix:
        # 22 is in maintenance (EOL 2027-04-30), 24 is Active LTS, 26 is Current.
        # Node 20 reached end-of-life on 2026-04-30 and is deliberately not tested.
        node-version: [ "22.x", "24.x", "26.x" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build the package
        run: |
          bun install
          bun run build

      # Installing the packed tarball rather than the working tree is what proves `files`,
      # `exports`, and the emitted .js extensions are all correct for a real consumer.
      - name: Pack and install into a clean Node project
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          echo '{ "name": "consumer", "type": "module", "private": true }' > package.json
          npm install /tmp/rippieapp-core-*.tgz drizzle-orm@^0.45.2

      - name: Smoke test on Node
        run: cd /tmp/consumer && node "$GITHUB_WORKSPACE/scripts/nodeSmokeTest.mjs"
